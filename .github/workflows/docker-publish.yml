name: Build and Push Kasm Image

on:
  schedule:
    - cron: '0 2 * * *' # Checks daily at 2 AM UTC; only rebuilds if the upstream image changed
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggers directly from the GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_IMAGE: kasmweb/kasmos-desktop:1.19.0-rolling-weekly

jobs:
  # On scheduled runs, only rebuild if upstream actually moved. The digest we
  # last built against is read back from a label baked into our own published
  # image, so no separate state store (repo var, cache, etc.) is needed.
  check-upstream:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      digest: ${{ steps.digest.outputs.upstream }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current upstream digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "${{ env.UPSTREAM_IMAGE }}" | awk '/^Digest:/ {print $2}')
          echo "upstream=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Get digest baked into our last published image
        id: last
        run: |
          LAST=$(docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" --format '{{json .Image.Config.Labels}}' 2>/dev/null | jq -r '.["org.opencontainers.image.base.digest"] // empty')
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

      - name: Compare digests
        id: compare
        run: |
          echo "Upstream digest:    ${{ steps.digest.outputs.upstream }}"
          echo "Last built against: ${{ steps.last.outputs.last }}"
          if [ "${{ steps.digest.outputs.upstream }}" != "${{ steps.last.outputs.last }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-upstream
    if: always() && (github.event_name != 'schedule' || needs.check-upstream.outputs.changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Cosign image signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Cosign for container signing (skipped on PRs)
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.5.0

      # Set up BuildKit container builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate smart Docker tags (e.g., :latest, :main, or :v1.0.0)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}

      # Build & Push (only pushes on push/schedule events, not PRs)
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UPSTREAM_DIGEST=${{ needs.check-upstream.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the image digest so you can verify authenticity
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
